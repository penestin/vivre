<!DOCTYPE html>
<html lang="fr">

<head>
  <title>Referents-Penestin.fr</title>
  <link rel="icon" type="image/png" href="favicon-vivrepenestin.png">
</head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🚧 • Site en construction • 🚧</title>

<style>
/* =====================================================
   BANDEAU CONSTRUCTION
   ===================================================== */
.bandeau-construction{
    background:#ffcc00;
    color:#000;
    text-align:center;
    font-weight:bold;
    font-size:18px;
    padding:12px;
    margin:0 auto 20px auto;
    border-radius:8px;
    max-width:700px;
    box-shadow:0 3px 8px rgba(0,0,0,.25);
}
/* =====================================================
   GENERAL
   ===================================================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f3f3;
    color: #205ba4;
}


/* =====================================================
   EN-TETE
   ===================================================== */

header {
    background: #fff273;
    color: white;
    padding: 18px 30px;
}

header h1 {
    margin: 0;
    font-size: 24px;
}

header p {
    margin: 6px 0 0;
    color: #ddd;
}


 
/* =====================================================
   MOBILE
   ===================================================== */

@media (max-width:850px){

    .carte-container{
    flex-direction:column;
    align-items:center;
    }

    .carte{
        width:100%;
        max-width:100%;
    }

.fiche{
    width:450px;
    flex-shrink:0;
    }

    .referent img{
        width:90px;
        height:90px;
    }
    
    .bandeau-secteurs{
    width:95%;
    max-width:none;
}
}


/* =====================================================
   TACTILE
   ===================================================== */

@media (hover: none) {

    .quartier:hover {
        transform: none;

        filter:
            drop-shadow(
                3px 5px 4px
                rgba(0,0,0,0.22)
            );
    }
/* =====================================================
   style logo
   ===================================================== */

}
.logo-penestin{
    display:block;
    width:250px;
    height:auto;
    margin:0 auto 15px auto;
    background:transparent;
    padding:5px;
    border-radius:5px;
}
</style>
</head>
<body>

<header>

    <img src="CT.png"
         alt="Ville de Pénestin"
         class="logo-penestin">
         
  

 
</header>



</body>
</html>
