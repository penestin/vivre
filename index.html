<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VivrePénestin.fr</title>

    <link rel="icon" type="image/png" href="favicon-vivrepenestin.png">

    <style>
        /* =====================================================
           GENERAL
        ===================================================== */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f3f3;
            color: #205ba4;
        }

        /* =====================================================
           EN-TETE
        ===================================================== */

        header {
            background: #205ba4;
            color: white;
            text-align: center;
            padding: 25px 20px;
        }

        .logo {
            width: 220px; /* Modifier ici la taille du logo */
            max-width: 90%;
            height: auto;
            display: block;
            margin: 0 auto 20px;
        }

        .intro {
            max-width: 1100px;
            margin: auto;
            font-size: 1.05rem;
            line-height: 1.6;
            color: white;
        }

        /* =====================================================
           CONTENEUR
        ===================================================== */

        .container {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        /* =====================================================
           TUILES
        ===================================================== */

        .tile {
            background: white;
            border-radius: 15px;
            padding: 15px;
            min-height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(0,0,0,.15);
            transition: all 0.3s ease;
        }

        .tile:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 24px rgba(0,0,0,.20);
        }

        .tile img {
            width: 100%;
            max-width: 200px;
            height: auto;
            display: block;
        }

        /* =====================================================
           TABLETTE
        ===================================================== */

        @media (max-width: 900px) {

            .grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .logo {
                width: 180px;
            }
        }

        /* =====================================================
           SMARTPHONE
        ===================================================== */

        @media (max-width: 600px) {

            .grid {
                grid-template-columns: 1fr;
            }

            .logo {
                width: 150px;
            }

            .intro {
                font-size: 0.95rem;
            }

            .tile {
                min-height: 160px;
            }

            .tile img {
                max-width: 170px;
            }
        }

    </style>
</head>

<body>

    <header>

        <img src="VP-500.png" alt="Logo Vivre Pénestin" class="logo">

        <p class="intro">
            Les Référents de secteur, le Conseil des Jeunes, le Conseil des Sages
            et l'Inventaire Participatif du Patrimoine contribuent à renforcer le
            dialogue avec les habitants, à valoriser les initiatives locales et à
            préserver l'identité de notre commune.
        </p>

    </header>

    <div class="container">

        <div class="grid">

            <a href="https://referents.vivrepenestin.fr/" target="_blank" class="tile">
                <img src="rs.png" alt="Référents de secteur">
            </a>

            <a href="https://jeunes.vivrepenestin.fr/" target="_blank" class="tile">
                <img src="cj.png" alt="Conseil des Jeunes">
            </a>

            <a href="https://sages.vivrepenestin.fr/" target="_blank" class="tile">
                <img src="cs.png" alt="Conseil des Sages">
            </a>

            <a href="https://patpen.vivrepenestin.fr/" target="_blank" class="tile">
                <img src="patpen.png" alt="Inventaire du Patrimoine">
            </a>

            <a href="#" class="tile">
                <img src="CT.png" alt="Actualités">
            </a>

            <a href="#" class="tile">
                <img src="CT.png" alt="Contact">
            </a>

        </div>

    </div>

</body>
</html>
