<style>
/* =====================================================
   BANDEAU CONSTRUCTION
   ===================================================== */
.bandeau-construction{
    background:#ffcc00;
    color:#000;
    text-align:center;
    font-weight:bold;
    font-size:18px;
    padding:12px;
    margin:0 auto 20px auto;
    border-radius:8px;
    max-width:700px;
    box-shadow:0 3px 8px rgba(0,0,0,.25);
}

/* =====================================================
   GENERAL
===================================================== */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f3f3f3;
    color:#205ba4;
}

/* =====================================================
   BANNIERE
===================================================== */

header{
    position:relative;

    min-height:320px;

    background-image:url("csm_La_Vilaine_b390939282.jpg");
    background-size:cover;
    background-position:center center;
    background-repeat:no-repeat;

    overflow:hidden;
}

header::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.0);
}

.hero-overlay{
    position:relative;
    z-index:2;

    min-height:320px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    padding:25px;
}

.logo{
    width:240px;
    max-width:90%;
    height:auto;

    background:rgba(255,255,255,0.96);

    border-radius:12px;

    padding:10px;

    margin-bottom:25px;

    box-shadow:0 4px 15px rgba(0,0,0,.30);
}

.intro{
    max-width:1200px;

    margin:auto;

    font-size:1.6rem;

    line-height:1.5;

    color:white;

    text-shadow:0 2px 10px rgba(0,0,0,.75);
}

/* =====================================================
   CONTENEUR
===================================================== */

.container{
    max-width:1100px;
    margin:35px auto;
    padding:0 20px;
}

/* =====================================================
   GRILLE
===================================================== */

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

/* =====================================================
   TUILES
===================================================== */

.tile{
    background:white;

    border-radius:15px;

    padding:15px;

    min-height:180px;

    display:flex;
    justify-content:center;
    align-items:center;

    text-decoration:none;

    box-shadow:0 4px 12px rgba(0,0,0,.15);

    transition:all .3s ease;
}

.tile:hover{
    transform:translateY(-5px);
    box-shadow:0 10px 24px rgba(0,0,0,.20);
}

.tile img{
    width:100%;
    max-width:200px;
    height:auto;
    display:block;
}

/* =====================================================
   TABLETTE
===================================================== */

@media (max-width:900px){

    .grid{
        grid-template-columns:repeat(2,1fr);
    }

    .logo{
        width:200px;
    }

    .intro{
        font-size:1.25rem;
    }
}

/* =====================================================
   SMARTPHONE
===================================================== */

@media (max-width:600px){

    header{
        min-height:260px;
        background-position:center center;
    }

    .hero-overlay{
        min-height:260px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .logo{
        width:140px;
        margin-bottom:15px;
    }

    .intro{
        font-size:1rem;
        line-height:1.4;
    }

    .tile{
        min-height:160px;
    }

    .tile img{
        max-width:170px;
    }
}

</style>

</head>

<header id="hero">

        </p>

    </div>

</header>

<div class="container">

        <a href="https://jeunes.vivrepenestin.fr/"
           target="_blank"

           class="tile">
            <img src="cj.png" alt="Conseil des Jeunes">
        </a>

       
        <a href="https://sages.vivrepenestin.fr/"
           target="_blank"
           rel="noopener noreferrer"
           class="tile">
            <img src="cs.png" alt="Conseil des Sages">
        </a>

        <a href="https://patpen.vivrepenestin.fr/"
           target="_blank"
           rel="noopener noreferrer"
           class="tile">
            <img src="patpen.png" alt="Inventaire Participatif du Patrimoine">
        </a>

        <a href="#" class="tile">
            <img src="CT.png" alt="Rubrique à venir">
        </a>

        <a href="#" class="tile">

    </div>

</div>
