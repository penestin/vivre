<!DOCTYPE html>
<html lang="fr">
    <head>
  <title>vivrePenestin.fr</title>
  <link rel="icon" type="image/png" href="favicon-vivrepenestin.png">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portail Vivre Pénestin</title>

<style>
/* =====================================================
   GENERAL
   ===================================================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f3f3;
    color: #205ba4;
}


/* =====================================================
   EN-TETE
   ===================================================== */

header {
    background: #205ba4;
    color: white;
    padding: 18px 30px;
}

header h1 {
    margin: 0;
    font-size: 24px;
}

header p {
    margin: 6px 0 0;
    color: #ddd;
}




/* Zone des tuiles */

.container{
    max-width:1400px;
    margin:40px auto;
    padding:0 20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:30px;
}

/* Tuile */

.tile{
    background:white;
    border-radius:18px;
    padding:25px;
    box-shadow:0 5px 18px rgba(0,0,0,0.15);
    transition:all .3s ease;
    text-decoration:none;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:260px;
}

.tile:hover{
    transform:translateY(-8px) scale(1.03);
    box-shadow:0 15px 35px rgba(0,0,0,0.25);
}

.tile img{
    width:100%;
    max-width:280px;
    height:auto;
    display:block;
}

/* Tablette */

@media (max-width:900px){

.grid{
    grid-template-columns:repeat(2,1fr);
}

}

/* Smartphone */

@media (max-width:600px){

.grid{
    grid-template-columns:1fr;
}

header img{
    max-width:220px;
}

.tile{
    min-height:220px;
}

}
</style>
    
</head>
<body>

<header>
    <img src="VP-500.png" alt="Logo principal">
</header>

<div class="container">

    <div class="grid">

        <a href="https://referents.vivrepenestin.fr/" target="_blank" class="tile">
            <img src="b.jpg" alt="Menu 1">
        </a>

        <a href="https://referents.vivrepenestin.fr/" target="_blank" class="tile">
            <img src="d.jpg" alt="Menu 2">
        </a>

        <a href="https://referents.vivrepenestin.fr/" target="_blank" class="tile">
            <img src="c.jpg" alt="Menu 3">
        </a>

        <a href="https://referents.vivrepenestin.fr/" target="_blank" class="tile">
            <img src="e.jpg" alt="Menu 4">
        </a>

        <a href="https://referents.vivrepenestin.fr/" target="_blank" class="tile">
            <img src="e.jpg" alt="Menu 5">
        </a>

        <a href="https://referents.vivrepenestin.fr/" target="_blank" class="tile">
            <img src="e.jpg" alt="Menu 6">
        </a>

    </div>

</div>

</body>
</html>
