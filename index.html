<!DOCTYPE html>
<html lang="fr">
    <head>
  <title>vivrePenestin.fr</title>
  <link rel="icon" type="image/png" href="favicon-vivrepenestin.png">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portail Vivre Pénestin</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Arial, Helvetica, sans-serif;
    background:#f4f6f8;
}

/* Bandeau */

header{
    background:#0d6efd;
    padding:25px 15px;
    text-align:center;
}

header img{
    max-width:300px;
    width:90%;
    height:auto;
}

/* Zone des tuiles */

.container{
    max-width:1400px;
    margin:40px auto;
    padding:0 20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:30px;
}

/* Tuile */

.tile{
    background:white;
    border-radius:18px;
    padding:25px;
    box-shadow:0 5px 18px rgba(0,0,0,0.15);
    transition:all .3s ease;
    text-decoration:none;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:260px;
}

.tile:hover{
    transform:translateY(-8px) scale(1.03);
    box-shadow:0 15px 35px rgba(0,0,0,0.25);
}

.tile img{
    width:100%;
    max-width:280px;
    height:auto;
    display:block;
}

/* Tablette */

@media (max-width:900px){

.grid{
    grid-template-columns:repeat(2,1fr);
}

}

/* Smartphone */

@media (max-width:600px){

.grid{
    grid-template-columns:1fr;
}

header img{
    max-width:220px;
}

.tile{
    min-height:220px;
}

}
</style>

</head>
<body>

<header>
    <img src="a.jpg" alt="Logo principal">
</header>

<div class="container">

    <div class="grid">

        <a href="https://referents.vivrepenestin.fr/" target="_blank" class="tile">
            <img src="b.jpg" alt="Menu 1">
        </a>

        <a href="https://referents.vivrepenestin.fr/" target="_blank" class="tile">
            <img src="d.jpg" alt="Menu 2">
        </a>

        <a href="https://referents.vivrepenestin.fr/" target="_blank" class="tile">
            <img src="c.jpg" alt="Menu 3">
        </a>

        <a href="https://referents.vivrepenestin.fr/" target="_blank" class="tile">
            <img src="e.jpg" alt="Menu 4">
        </a>

        <a href="https://referents.vivrepenestin.fr/" target="_blank" class="tile">
            <img src="e.jpg" alt="Menu 5">
        </a>

        <a href="https://referents.vivrepenestin.fr/" target="_blank" class="tile">
            <img src="e.jpg" alt="Menu 6">
        </a>

    </div>

</div>

</body>
</html>
